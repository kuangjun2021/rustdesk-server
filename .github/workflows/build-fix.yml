name: Build hardened hbbs-hbbr

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forapi
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply hardening
        run: |
          python3 - << 'PYEOF'
          p = 'src/jwt.rs'
          s = open(p).read()
          s = s.replace('    println!("secret: {:}", SECRET.to_string());\n', '')
          open(p, 'w').write(s)

          p = 'src/rendezvous_server.rs'
          s = open(p).read()
          old = 'if let Some(peer) = self.pm.get_in_memory(&rf.id).await {'
          new = 'if MUST_LOGIN.load(Ordering::SeqCst) {\n                        if rf.token.is_empty()\n                            || (!jwt::SECRET.is_empty()\n                                && jwt::verify_token(&rf.token).is_err())\n                        {\n                            log::warn!("RequestRelay rejected: login required");\n                            return true;\n                        }\n                    }\n                    if let Some(peer) = self.pm.get_in_memory(&rf.id).await {'
          assert s.count(old) == 1, 'anchor not found: %d' % s.count(old)
          s = s.replace(old, new)
          open(p, 'w').write(s)
          print('hardening applied')
          PYEOF

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: hbbs-hbbr-linux-amd64
          path: |
            target/release/hbbs
            target/release/hbbr
